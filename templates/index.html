<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>潛水預約表單</title>
</head>
<body>
<h1>潛水預約</h1>
<form action="/book" method="post">
姓名：<input name="name"><br>
電話：<input name="phone"><br>
Email：<input name="email"><br>
日期：<input type="date" name="dive_date"><br>
時段：<select name="time_slot">
{% for s in time_slots %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
</select><br>
方案：<select name="package">
{% for p in packages %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
</select><br>
人數：<input name="divers_count" value="1"><br>
備註：<textarea name="notes"></textarea><br>
<button type="submit">送出</button>
</form>
{% if message %}<p>{{ message }}</p>{% endif %}
</body></html>
