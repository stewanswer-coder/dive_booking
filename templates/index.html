<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>潛水預約</title>
  <style>
    label { display:inline-block; width:110px; margin-top:6px; vertical-align: top; }
    input, select, textarea { margin-top:6px }
    .equip-list { margin-left: 110px; }
  </style>
</head>
<body>
  <h1>潛水預約表單</h1>
  <form action="/book" method="post">

    <!-- 基本資料 -->
    <label for="name">姓名：</label>
    <input id="name" name="name" required><br>

    <label for="phone">電話：</label>
    <input id="phone" name="phone" required><br>

    <label for="line_id">LINE ID：</label>
    <input id="line_id" name="line_id" placeholder="例如: @abcd1234"><br>

    <label for="email">Email：</label>
    <input id="email" name="email" type="email" required><br>

    <label for="coach">教練：</label>
    <select id="coach" name="coach" required>
      <option value="阿行教練">阿行教練</option>
    </select><br>

    <!-- 日期與時段 -->
    <label for="dive_date">日期：</label>
    <input id="dive_date" type="date" name="dive_date" required><br>

    <label for="time_slot">時段：</label>
    <select id="time_slot" name="time_slot" required>
      {% for s in time_slots %}
        <option value="{{s}}">{{s}}</option>
      {% endfor %}
    </select><br>

    <!-- 潛水方案 -->
    <label for="package">方案：</label>
    <select id="package" name="package" required>
      <option value="體驗潛水 (Try Diving)">體驗潛水 (Try Diving)</option>
      <option value="PADI Open Water Diver">PADI Open Water Diver</option>
      <option value="PADI Advanced Open Water Diver">PADI Advanced Open Water Diver</option>
      <option value="PADI Rescue Diver">PADI Rescue Diver</option>
      <option value="Fun Dive 小隊 (持證)">Fun Dive 小隊 (持證)</option>
      <option value="拍照小隊 (持證 + 自備相機)">拍照小隊 (持證 + 自備相機)</option>
      <option value="PADI 專長潛水課程">PADI 專長潛水課程</option>
    </select><br>

    <!-- 人數 -->
    <label for="divers_count">人數：</label>
    <input id="divers_count" name="divers_count" type="number" min="1" value="1" required><br>

    <!-- 裝備需求 -->
    <hr>
    <h3>裝備租借</h3>

    <label for="need_equipment">是否需要租裝備：</label>
    <select id="need_equipment" name="need_equipment" required>
      <option value="Y">是</option>
      <option value="N">否</option>
    </select><br>

    <label>租借裝備項目：</label><br>
    <div class="equip-list">
      <label><input type="checkbox" name="equipment_items" value="面鏡"> 面鏡</label><br>
      <label><input type="checkbox" name="equipment_items" value="調節器"> 調節器</label><br>
      <label><input type="checkbox" name="equipment_items" value="BCD"> BCD</label><br>
      <label><input type="checkbox" name="equipment_items" value="防寒衣"> 防寒衣</label><br>
      <label><input type="checkbox" name="equipment_items" value="套鞋"> 套鞋</label><br>
      <label><input type="checkbox" name="equipment_items" value="蛙鞋"> 蛙鞋</label><br>
    </div>

    <label for="height">身高 (cm)：</label>
    <input id="height" name="height" type="number" min="100" max="250"><br>

    <label for="weight">體重 (kg)：</label>
    <input id="weight" name="weight" type="number" min="30" max="150"><br>

    <label for="shoe_size">鞋號 (cm)：</label>
    <input id="shoe_size" name="shoe_size" type="number" min="22" max="30"><br>

    <label for="notes">備註：</label>
    <textarea id="notes" name="notes" rows="3" cols="28"></textarea><br>

    <button type="submit">送出預約</button>
  </form>

  {% if message %}
    <p style="color:#b00">{{ message }}</p>
  {% endif %}
</body>
</html>
