<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>潛水預約</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
  <h1>潛水預約</h1>
  <form action="/book" method="POST">
    <label>姓名 <input name="name" required></label><br>
    <label>手機 <input name="phone" required></label><br>
    <label>LINE ID <input name="line_id"></label><br>
    <label>Email <input type="email" name="email" required></label><br>

    <label>教練
      <select name="coach">
        {% for c in coaches %}<option>{{ c }}</option>{% endfor %}
      </select>
    </label><br>

    <label>日期 <input type="date" name="dive_date" required></label><br>

    <label>時段
      <select name="time_slot">
        {% for t in time_slots %}<option>{{ t }}</option>{% endfor %}
      </select>
    </label><br>

    <label>方案
      <select name="package">
        {% for p in packages %}<option>{{ p }}</option>{% endfor %}
      </select>
    </label><br>

    <label>人數 <input type="number" name="divers_count" min="1" value="1"></label><br>

    <label><input type="checkbox" name="need_equipment"> 需要裝備</label><br>
    <label><input type="checkbox" name="equipment_items" value="BCD"> BCD</label>
    <label><input type="checkbox" name="equipment_items" value="Reg"> 調節器</label>
    <label><input type="checkbox" name="equipment_items" value="Wetsuit"> 防寒衣</label><br>

    <label>身高 <input name="height" placeholder="cm"></label><br>
    <label>體重 <input name="weight" placeholder="kg"></label><br>
    <label>鞋號 <input name="shoe_size"></label><br>
    <label>備註 <textarea name="notes"></textarea></label><br>

    <button type="submit">送出預約</button>
  </form>
</body>
</html>
